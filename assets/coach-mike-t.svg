<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Coach Mike T">
  <defs>
    <clipPath id="cm-frame"><rect width="120" height="120"/></clipPath>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2330"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <clipPath id="cm-head"><ellipse cx="60" cy="47" rx="25" ry="29"/></clipPath>
    <pattern id="cm-buzz" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
      <circle cx=".8" cy=".8" r=".42" fill="#050506"/>
    </pattern>
    <linearGradient id="cm-knit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#cm-frame)">
    <!-- sfondo con la fascia inclinata del design system -->
    <rect width="120" height="120" fill="url(#cm-bg)"/>
    <path d="M78 0 H120 V120 H52 Z" fill="#ff5a1f" opacity=".14"/>

    <!-- spalle e maglia a collo alto blu -->
    <path d="M10 124 C12 98 32 88 60 88 C88 88 108 98 110 124 Z" fill="url(#cm-knit)"/>
    <g stroke="#1e40af" stroke-width="1.2" opacity=".55">
      <path d="M30 102 L30 124"/><path d="M40 96 L40 124"/><path d="M50 93 L50 124"/>
      <path d="M70 93 L70 124"/><path d="M80 96 L80 124"/><path d="M90 102 L90 124"/>
    </g>
    <!-- il collo alto, risvoltato -->
    <path d="M42 72 Q60 64 78 72 L80 92 Q60 100 40 92 Z" fill="#2563eb"/>
    <path d="M41 81 Q60 74 79 81" fill="none" stroke="#1e40af" stroke-width="1.8"/>
    <g stroke="#1e40af" stroke-width="1" opacity=".6">
      <path d="M47 80 L46.5 94"/><path d="M53 78.5 L53 96"/><path d="M60 78 V97"/><path d="M67 78.5 L67 96"/><path d="M73 80 L73.5 94"/>
    </g>

    <!-- collo e testa -->
    <rect x="50" y="62" width="20" height="14" rx="4" fill="#d19c76"/>
    <ellipse cx="34.5" cy="50" rx="4.5" ry="6" fill="#d19c76"/>
    <ellipse cx="85.5" cy="50" rx="4.5" ry="6" fill="#d19c76"/>
    <ellipse cx="34.8" cy="50" rx="2" ry="3.2" fill="#b8815c"/>
    <ellipse cx="85.2" cy="50" rx="2" ry="3.2" fill="#b8815c"/>
    <ellipse cx="60" cy="47" rx="25" ry="29" fill="#deac86"/>

    <!-- capelli rasati: una trama fitta sulla calotta, con l'attaccatura -->
    <g clip-path="url(#cm-head)">
      <path d="M30 40 C33 30 38 27 44 28 C50 26 55 30 60 29 C65 30 70 26 76 28 C82 27 87 30 90 40 L90 10 L30 10 Z" fill="#0b0b0d" opacity=".72"/>
      <path d="M30 40 C33 30 38 27 44 28 C50 26 55 30 60 29 C65 30 70 26 76 28 C82 27 87 30 90 40 L90 10 L30 10 Z" fill="url(#cm-buzz)" opacity=".8"/>
    </g>

    <!-- sopracciglia, occhi, naso, bocca: lo sguardo di chi ha visto mille ragazzi crescere -->
    <path d="M44 41 Q50 37.5 55 40" fill="none" stroke="#121214" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M65 40 Q70 37.5 76 41" fill="none" stroke="#121214" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="50" cy="47" rx="3.4" ry="2.6" fill="#fff"/>
    <ellipse cx="70" cy="47" rx="3.4" ry="2.6" fill="#fff"/>
    <circle cx="50.4" cy="47.2" r="1.9" fill="#3b2418"/>
    <circle cx="70.4" cy="47.2" r="1.9" fill="#3b2418"/>
    <circle cx="51" cy="46.5" r=".6" fill="#fff"/>
    <circle cx="71" cy="46.5" r=".6" fill="#fff"/>
    <path d="M45.5 51.5 Q50 53.5 54.5 51.5" fill="none" stroke="#bf8a65" stroke-width="1"/>
    <path d="M65.5 51.5 Q70 53.5 74.5 51.5" fill="none" stroke="#bf8a65" stroke-width="1"/>
    <path d="M58.5 49 Q57 54 56.5 56.5" fill="none" stroke="#bf8a65" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M55.5 57.5 Q57.5 59.5 60 58.6 Q62.5 59.5 64.5 57.5" fill="none" stroke="#9c6a4a" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M49.5 63 Q51 64.5 51 64" fill="none" stroke="#5a3526" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M70.5 63 Q69 64.5 69 64" fill="none" stroke="#5a3526" stroke-width="1.2" stroke-linecap="round"/>
    <!-- la bocca -->
    <path d="M51 64 Q60 70.5 69 64" fill="none" stroke="#3a2219" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
